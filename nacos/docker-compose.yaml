services:
  nacos-server:
    image: nacos/nacos-server
    container_name: nacos-server

    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=serverIdentityValue
      - NACOS_AUTH_TOKEN=yeGwejq9+yqQWkBwH9xaxKFEkakCd5oGhI2o8Hs1T+s=

    volumes:
      - ./standalone-logs:/home/nacos/logs

    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"